{% extends "layout.html" %}
{% load static %}
{% block title %}Buscar producto<script src="{% static 'js/escaner.js' %}"></script>
{% endblock %}
{% block body %}
<div class="container py-3"><h2>Buscar producto</h2><p class="text-muted">Escanea o escribe el código de barras, QR o SKU.</p>
<div class="card mb-4"><div class="card-body"><form method="get"><div class="input-group"><input id="codigo-busqueda" name="q" aria-label="Código del producto" value="{{ query }}" class="form-control" autofocus required><button type="button" class="btn btn-outline-secondary" data-escaner="#codigo-busqueda" data-escaner-envia title="Escanear con la cámara"><i class="fa-solid fa-camera"></i> Cámara</button><button class="btn btn-primary">Buscar</button></div></form></div></div>
{% if query %}{% include "inventory/partials/producto_card.html" %}{% endif %}
<a href="{% url 'inventory:productos' %}" class="btn btn-outline-secondary mt-3">Volver al inventario</a></div>
<script src="{% static 'js/escaner.js' %}"></script>
{% endblock %}
