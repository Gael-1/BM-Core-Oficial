<div class="card"><div class="table-responsive"><table class="table"><thead><tr><th>Producto</th><th>SKU</th><th>Existencia</th><th>Mínimo</th><th>Acciones</th></tr></thead><tbody>
{% for producto in productos %}<tr><td>{{ producto.nombre }}</td><td>{{ producto.sku }}</td><td>{{ producto.stock_actual }}</td><td>{{ producto.stock_min }}</td><td>{% if puede_inventario %}<a href="{% url 'inventory:edit' producto.pk %}" class="btn btn-outline-primary btn-sm">Revisar</a>{% endif %}</td></tr>{% empty %}<tr><td colspan="5" class="text-center py-4">No hay productos con stock bajo.</td></tr>{% endfor %}
</tbody></table></div></div>
