<div class="card"><div class="table-responsive"><table class="table"><thead><tr><th>Producto</th><th>SKU</th><th>Almacén</th><th>Existencia</th><th>Acciones</th></tr></thead><tbody>
{% for fila in inventario %}<tr><td>{{ fila.producto.nombre }}</td><td>{{ fila.producto.sku }}</td><td>{{ fila.almacen.nombre|default:'Sin asignar' }}</td><td>{{ fila.cantidad }}</td><td>{% if puede_inventario %}<a href="{% url 'inventory:edit' fila.producto.pk %}" class="btn btn-outline-primary btn-sm">Editar</a> <a href="{% url 'inventory:traspaso' %}?producto={{ fila.producto.pk }}" class="btn btn-outline-secondary btn-sm">Traspasar</a>{% endif %}</td></tr>{% empty %}<tr><td colspan="5" class="text-center py-4">No hay existencias para esta selección.</td></tr>{% endfor %}
</tbody></table></div></div>
