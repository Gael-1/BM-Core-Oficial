<div class="card"><div class="table-responsive"><table class="table"><thead><tr><th>Producto</th><th>SKU</th><th>Almacén</th><th>Existencia</th><th>Acciones</th></tr></thead><tbody>
{% for item in inventario %}<tr><td>{{ item.producto_id.nombre }}</td><td>{{ item.producto_id.sku }}</td><td>{{ item.almacen.nombre|default:'Sin asignar' }}</td><td>{{ item.cantidad }}</td><td>{% if puede_inventario %}<a href="{% url 'inventory:edit' item.producto_id.pk %}" class="btn btn-outline-primary btn-sm">Editar</a>{% endif %}</td></tr>{% empty %}<tr><td colspan="5" class="text-center py-4">No hay existencias para esta selección.</td></tr>{% endfor %}
</tbody></table></div></div>
